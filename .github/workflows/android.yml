name: Build AdventureGo Android
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare bundled web app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html privacy.html terms.html manifest.webmanifest sw.js icon.svg android/app/src/main/assets/
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Build release AAB
        working-directory: android
        run: gradle --no-daemon bundleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AdventureGo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: AdventureGo-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
